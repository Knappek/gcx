name: Bug report
description: Report something in gcx that doesn't work as expected
type: Bug
labels: ["action/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Remove credentials, and replace stack names, URLs and IDs with placeholders. Report security vulnerabilities through the [private security channel](https://github.com/grafana/gcx/security/policy) instead.

  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched [existing issues](https://github.com/grafana/gcx/issues?q=is%3Aissue) and this bug isn't reported yet.
          required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: |
        What you ran, what you expected, and what happened instead. Include the full command and its output. Running with `-v`, `-vv` or `-vvv` prints more detail.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands that shows the bug.
      placeholder: |
        1. gcx config use-context <my-context>
        2. gcx resources push ./dashboards/
        3. See error: 403 Forbidden
    validations:
      required: true

  - type: input
    id: gcx_version
    attributes:
      label: gcx version
      description: Output of `gcx --version`.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, and Grafana version or Grafana Cloud.
      placeholder: macOS 15 arm64, Grafana Cloud
