name: Feature proposal
description: Propose a new capability, command or improvement
type: Feature
labels: ["action/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form whether you want to build the feature or are asking for it. New commands, flags and providers need maintainer agreement before implementation: see [CONTRIBUTING.md](https://github.com/grafana/gcx/blob/main/CONTRIBUTING.md#new-commands-need-an-issue-first). [#1469](https://github.com/grafana/gcx/issues/1469) is an example of a detailed proposal.

        This issue is public. Use anonymized examples and keep credentials and internal information out.

  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched [existing issues](https://github.com/grafana/gcx/issues?q=is%3Aissue) and this hasn't been proposed yet.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who runs into this, what happens today, and why the current behavior or workaround isn't enough.
    validations:
      required: true

  - type: textarea
    id: proposed_ux
    attributes:
      label: Proposed UX
      description: What a user should be able to do. Show it with commands and example output. A short before/after is enough for a small change.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Outcomes a reviewer can check to decide the work is done.
      placeholder: |
        - [ ] A user can ...
        - [ ] When ..., gcx ...
    validations:
      required: true

  - type: textarea
    id: scope_and_questions
    attributes:
      label: Open questions and scope
      description: What is out of scope, alternatives considered, and anything still undecided.

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation notes
      description: Relevant APIs, constraints or dependencies, marking what you verified and what you assume. Say if you want to implement it, and link any prototype.
